[package]
name = "ffwd-bot"
version = "0.1.0"
edition = "2024"
publish = false
description = "Aggregates open Compatibility Report issues into a proposed profiles.json patch, reviewed by a human before anything is ever signed. Run only by .github/workflows/aggregate-reports.yml. Vendored from the private FastForward Engine repo's gui/crates/ffwd-bot + gui/crates/ffwd-core/src/report.rs — see src/report.rs's header before editing."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "ffwd-bot"
path = "src/main.rs"
